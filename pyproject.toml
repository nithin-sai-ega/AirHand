[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airhand"
version = "0.0.1"
description = "Apple Watch IMU to Windows cursor and gesture control"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Dependencies are added phase by phase so the environment only contains what is used.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, UP: modern syntax,
# B: likely bugs, SIM: simplifications, N: naming.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
